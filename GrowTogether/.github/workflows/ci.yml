name: CI/CD Pipeline - GrowTogether

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # ==================== UNIT TESTS ====================
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GrowTogether/package-lock.json

      - name: 📚 Install Dependencies
        working-directory: ./GrowTogether
        run: npm ci

      - name: 🧪 Run Unit Tests
        working-directory: ./GrowTogether
        run: npm run test:ci
        env:
          CI: true

      - name: 📊 Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: GrowTogether/coverage/
          retention-days: 30

      - name: 📋 Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: GrowTogether/junit.xml
          retention-days: 30

  # ==================== INTEGRATION TESTS ====================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: growtogether
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpassword
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GrowTogether/package-lock.json

      - name: 📚 Install Dependencies
        working-directory: ./GrowTogether
        run: npm ci

      - name: 🗄️ Initialize Database
        run: |
          mysql -h 127.0.0.1 -u root -prootpassword growtogether < GrowTogether/mysql/init.sql

      - name: 🔗 Run Integration Tests
        working-directory: ./GrowTogether
        run: npm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_USER: testuser
          DB_PASSWORD: testpassword
          DB_NAME: growtogether
          JWT_SECRET: test-jwt-secret-for-ci
          CI: true

  # ==================== LINTING & CODE QUALITY ====================
  lint:
    name: 🔍 Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GrowTogether/package-lock.json

      - name: 📚 Install Dependencies
        working-directory: ./GrowTogether
        run: npm ci

      - name: 🔍 Check for syntax errors
        working-directory: ./GrowTogether
        run: node --check server.js && node --check db.js

  # ==================== DOCKER BUILD TEST ====================
  docker-build:
    name: 🐳 Docker Build
    runs-on: ubuntu-latest
    needs: [unit-tests, lint]
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build Docker Image
        working-directory: ./GrowTogether
        run: docker build -t growtogether:test .

      - name: 🧪 Test Docker Image
        run: |
          docker run -d --name test-container -p 3000:3000 growtogether:test
          sleep 5
          docker logs test-container
          docker stop test-container
          docker rm test-container

  # ==================== SECURITY SCAN ====================
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: GrowTogether/package-lock.json

      - name: 📚 Install Dependencies
        working-directory: ./GrowTogether
        run: npm ci

      - name: 🔒 Run npm audit
        working-directory: ./GrowTogether
        run: npm audit --audit-level=high
        continue-on-error: true

  # ==================== DEPLOY (nur bei Push auf main) ====================
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Deploy Info
        run: |
          echo "✅ Alle Tests bestanden!"
          echo "🚀 Bereit für Deployment"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
