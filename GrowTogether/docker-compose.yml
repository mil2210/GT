services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpw
      MYSQL_DATABASE: growtogether
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppw
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpw"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    environment:
      DB_HOST: db
      DB_USER: appuser
      DB_PASSWORD: apppw
      DB_NAME: growtogether
      JWT_SECRET: "change-me"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: